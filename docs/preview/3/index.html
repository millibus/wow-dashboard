      const params = new URLSearchParams(window.location.search);
      const g = params.get('game');
      if (g === 'retail' || g === 'forever') state.game = g;
      const gu = params.get('guild');
      if (gu === 'deaths-edge' || gu === 'riot-act') state.guild = gu;
      const v = params.get('view');
      if (['roster', 'detail', 'raids', 'readiness', 'collections', 'leaderboard'].includes(v)) {
        state.view = v === 'leaderboard' ? 'collections' : v;
      }
      const c = params.get('char');
      if (c) state.selectedCharId = Number(c);
    }

    function classColor(className) {
      const m = CLASS_META[className];
      if (!m) return 'var(--text-muted)';
      return state.game === 'forever' ? m.lightText : m.darkText;
    }

    function classHex(className) {
      return CLASS_META[className]?.hex || '#64748B';
    }

    function classBarColor(className) {
      if (state.game === 'forever' && className === 'Priest') return '#475569';
      return CLASS_META[className]?.hex || '#64748B';
    }

    function memberRole(m) {
      if (!m.className) return 'DPS';
      const spec = (m.spec || '').toLowerCase();
      if (['protection', 'blood', 'guardian', 'brewmaster', 'vengeance'].some(s => spec.includes(s))) return 'Tank';
      if (['holy', 'discipline', 'restoration', 'mistweaver', 'preservation'].some(s => spec.includes(s))) return 'Healer';
      if (!m.spec) {
        if (m.className === 'Warrior') return 'Tank';
        if (['Priest', 'Shaman', 'Druid', 'Paladin'].includes(m.className)) return 'Healer';
      }
      return 'DPS';
    }

    // Comparable Item Level & Readiness Calculator
    // Crucial domain truth: Level 70 characters have legacy expansion ilvls (322-393) while Level 90 cap is ~180-210.
    function isLegacyScale(m) {
      return state.game === 'retail' && m.level && m.level < 80 && m.ilvl && m.ilvl > 140;
    }

    function computeReadiness(m) {
      if (!m.className || m.ilvl == null) return null;
      const cap = state.game === 'forever' ? 60 : 90;
      const targetIlvl = state.game === 'forever' ? 58 : 210;

      const lvlScore = Math.min(1, (m.level || 1) / cap) * 35;
      const effectiveIlvl = isLegacyScale(m) ? Math.min(m.ilvl, 70) : m.ilvl;
      const gearScore = Math.min(1, effectiveIlvl / targetIlvl) * 45;

      const eq = m.equipmentSummary || { count: 16, emptySockets: 0, unenchanted: 16 };
      const socketPenalty = state.game === 'forever' ? 0 : Math.min(10, (eq.emptySockets || 0) * 3.5);
      const socketScore = state.game === 'forever' ? 10 : Math.max(0, 10 - socketPenalty);

      const enchantedRatio = eq.count ? Math.max(0, (eq.count - (eq.unenchanted || 0)) / Math.min(8, eq.count)) : 0;
      const enchantScore = Math.min(10, enchantedRatio * 10);

      const total = Math.round(lvlScore + gearScore + socketScore + enchantScore);
      return m.level < cap ? Math.min(74, total) : total;
    }

    function readinessTier(score) {
      if (score == null) return { key: 'unknown', label: '—' };
      if (score >= 78) return { key: 'ready', label: score + ' · Ready' };
      if (score >= 58) return { key: 'watch', label: score + ' · Prep' };
      return { key: 'risk', label: score + ' · Leveling' };
    }

    function progressionSortScore(m) {
      if (!m.className) return -1000 + (m.level || 0);
      const cap = state.game === 'forever' ? 60 : 90;
      const tierWeight = m.level >= cap ? 10000 : (m.level >= 80 ? 5000 : m.level * 30);
      const cleanIlvl = isLegacyScale(m) ? 65 : (m.ilvl || 0);
      return tierWeight + cleanIlvl;
    }

    function formatRelativeTime(ts) {
      if (!ts) return '—';
      const refNow = new Date('2026-11-13T20:00:00Z').getTime();
      const diffMs = Math.max(0, refNow - ts);
      const hours = Math.floor(diffMs / 3600000);
      if (hours < 1) return 'Just now';
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 30) return days + 'd ago';
      const months = Math.floor(days / 30);
      return months + 'mo ago';
    }

    function getActiveDataset() {
      if (state.game === 'forever') {
        return DATA.forever['deaths-edge'];
      }
      return DATA.retail[state.guild] || DATA.retail['deaths-edge'];
    }

    function setGame(g) {
      state.game = g;
      state.rosterBracket = 'all';
      state.ownerFilter = 'all';
      state.classFilter = 'all';
      state.selectedCharId = null;
      state.compareCharId = null;
      render();
    }

    function setGuild(gu) {
      state.guild = gu;
      state.selectedCharId = null;
      state.compareCharId = null;
      render();
    }

    function setView(v, charId) {
      state.view = v;
      if (charId) state.selectedCharId = Number(charId);
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function buildFallbackEquipment(m) {
      if (m.equipment && m.equipment.length) return m.equipment;
      const baseIlvl = m.ilvl || 60;
      const slots = state.game === 'forever'
        ? ['Head','Neck','Shoulders','Back','Chest','Wrist','Hands','Waist','Legs','Feet','Ring 1','Ring 2','Trinket 1','Trinket 2','Main Hand','Off Hand','Ranged']
        : ['Head','Neck','Shoulders','Back','Chest','Wrist','Hands','Waist','Legs','Feet','Ring 1','Ring 2','Trinket 1','Trinket 2','Main Hand','Off Hand'];
      return slots.map((slot, idx) => ({
        slot,
        name: (state.game === 'forever' ? 'Expedition ' : 'Wayfarer\'s ') + slot,
        ilvl: Math.max(1, baseIlvl + ((idx % 3) - 1) * 2),
        quality: baseIlvl >= 180 || (state.game === 'forever' && baseIlvl >= 55) ? 'Rare' : 'Uncommon',
        enchantCount: idx === 14 ? 1 : 0,
        hasEmptySocket: false,
        stats: [{ n: 'Sta', v: Math.max(5, Math.round(baseIlvl * 1.4)) }, { n: 'Crit', v: Math.max(3, Math.round(baseIlvl * 0.4)) }]
      }));
    }

    function renderMasthead(ds) {
      const members = ds.members;
      const cap = state.game === 'forever' ? 60 : 90;
      const targetIlvl = state.game === 'forever' ? 58 : 210;
      const atCap = members.filter(m => m.level >= cap);
      const levelingActive = state.game === 'forever'
        ? members.filter(m => m.level >= 45 && m.level < 60)
        : members.filter(m => m.level >= 80 && m.level < 90);
      const indexed = members.filter(m => m.className);
      const topIlvl = atCap.length ? Math.max(...atCap.map(m => m.ilvl || 0)) : Math.max(...indexed.filter(m => !isLegacyScale(m)).map(m => m.ilvl || 0));

      const isHorde = ds.faction === 'horde';
      const crestSvg = state.game === 'forever'
        ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E5BA68" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><polygon points="12 5 14.2 9.8 19.5 10.3 15.5 13.8 16.7 19 12 16.2 7.3 19 8.5 13.8 4.5 10.3 9.8 9.8 12 5"/></svg>'
        : (isHorde
          ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F45D75" stroke-width="2"><path d="M12 2L7 7v5l-3 3 4 7 4-3 4 3 4-7-3-3V7l-5-5z"/><circle cx="12" cy="11" r="2.5"/></svg>'
          : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 7v10M8 11h8"/></svg>');

      const kickerText = state.game === 'forever'
        ? 'WORLD OF WARCRAFT: FOREVER · ' + ds.ruleset.toUpperCase() + ' · HORDE'
        : 'RETAIL · MIDNIGHT SEASON 1 · ' + ds.realm.toUpperCase() + ' (' + ds.region.toUpperCase() + ') · ' + ds.faction.toUpperCase();

      const subText = state.game === 'forever'
        ? 'Classic+ Expedition Roster · Level Cap 60 · 9 Classes · Raids unlock 9 December 2026'
        : members.length + ' registered characters (' + indexed.length + ' API-indexed, ' + (members.length - indexed.length) + ' unindexed) · Raid Ready target: Lv 90 / iLvl ' + targetIlvl;

      return `
        <section class="guild-masthead">
          <div class="masthead-identity">
            <div class="faction-crest">${crestSvg}</div>
            <div>
              <div class="masthead-kicker">${kickerText}</div>
              <h1 class="masthead-title">${ds.guild}</h1>
              <p class="masthead-sub">${subText}</p>
            </div>
          </div>
          <div class="masthead-metrics">
            <div class="pulse-stat highlight">
              <span class="pulse-val">${atCap.length} <span style="font-size:13px;font-weight:500;color:var(--text-muted)">/ ${members.length}</span></span>
              <span class="pulse-lbl">At Level ${cap} Cap</span>
            </div>
            <div class="pulse-stat">
              <span class="pulse-val">${levelingActive.length}</span>
              <span class="pulse-lbl">${state.game === 'forever' ? 'Lv 45–59 Push' : 'Lv 80–89 Bracket'}</span>
            </div>
            <div class="pulse-stat">
              <span class="pulse-val">${topIlvl || '—'} <span style="font-size:12px;font-weight:500;color:var(--text-muted)">/ ${targetIlvl}</span></span>
              <span class="pulse-lbl">Lead Cap iLvl</span>
            </div>
          </div>
        </section>
      `;
    }

    function renderRosterView(ds) {
      const members = ds.members;
      const cap = state.game === 'forever' ? 60 : 90;
      const targetIlvl = state.game === 'forever' ? 58 : 210;

      const vanguard = [...members]
        .filter(m => m.className)
        .sort((a, b) => progressionSortScore(b) - progressionSortScore(a))
        .slice(0, 4);

      const vanguardCardsHtml = vanguard.map(m => {
        const score = computeReadiness(m);
        const tier = readinessTier(score);
        const cHex = classHex(m.className);
        const cBar = classBarColor(m.className);
        const cText = classColor(m.className);
        const pct = Math.min(100, Math.round(((isLegacyScale(m) ? 70 : (m.ilvl || 0)) / targetIlvl) * 100));
        const eq = m.equipmentSummary || { count: 16, emptySockets: 0, unenchanted: 0 };
        const auditText1 = state.game === 'forever'
          ? (m.attunements && m.attunements.length ? '✓ ' + m.attunements[0].split(' ')[0] + ' Attuned' : (m.zone || 'Azeroth'))
          : (eq.emptySockets > 0 ? eq.emptySockets + ' Empty Socket' + (eq.emptySockets > 1 ? 's' : '') : 'Sockets OK');
        const auditText2 = (eq.unenchanted || 0) + ' Unenchanted';

        return `
          <button type="button" class="vanguard-card" onclick="setView('detail', ${m.id})" aria-label="Inspect ${m.name}">
            <div class="vanguard-art-wrap">
              <div class="vanguard-aura" style="background:${cHex}"></div>
              ${m.mainRawUrl ? '<img class="vanguard-render" src="' + m.mainRawUrl + '" alt="' + m.name + '" loading="eager" />' : ''}
              <div class="vanguard-scrim"></div>
              <div class="vanguard-top-badges">
                <span class="lvl-pill">Lv ${m.level}</span>
                ${m.owner ? '<span class="owner-pill">' + m.owner + '</span>' : ''}
              </div>
            </div>
            <div class="vanguard-body">
              <div>
                <div class="vanguard-name" style="color:${cText}">${m.name}</div>
                <div class="vanguard-spec">
                  <span>${m.race || ''} ${m.spec ? m.spec + ' ' : ''}${m.className}</span>
                </div>
              </div>
              <div class="vanguard-stats-row">
                <div class="ilvl-box">
                  <span class="ilvl-num">${m.ilvl ?? '—'}</span>
                  <span class="ilvl-target">/ ${targetIlvl} iLvl</span>
                </div>
                <span class="ready-chip ${tier.key}">${tier.label}</span>
              </div>
              <div class="vanguard-bar-track">
                <div class="vanguard-bar-fill" style="width:${pct}%;background:${cBar}"></div>
              </div>
              <div class="vanguard-audit-row">
                <span class="audit-micro">${auditText1}</span>
                <span class="audit-micro">${auditText2}</span>
              </div>
            </div>
          </button>
        `;
      }).join('');

      const campaignHtml = state.game === 'forever' ? `
        <aside class="campaign-card">
          <div>
            <div class="campaign-kicker">Expedition Gate · 26 Days Remaining</div>
            <h2 class="campaign-title">Raids Open 9 December</h2>
            <p class="campaign-desc">No raid kills exist yet. Mobilizing Lv 60 champions and Drakefire Amulet attunements for opening night.</p>
          </div>
          <div class="campaign-raid-list">
            <div class="campaign-raid-item">
              <div>
                <div class="campaign-raid-name">Barrow Deeps</div>
                <div class="campaign-raid-meta">10-Player · 8 Bosses · iLvl 55+</div>
              </div>
              <span class="campaign-raid-badge">3 / 10 at Lv 60</span>
            </div>
            <div class="campaign-raid-item">
              <div>
                <div class="campaign-raid-name">Hyjal Summit</div>
                <div class="campaign-raid-meta">20-Player · 13 Bosses · iLvl 58+</div>
              </div>
              <span class="campaign-raid-badge">3 / 20 at Lv 60</span>
            </div>
            <div class="campaign-raid-item">
              <div>
                <div class="campaign-raid-name">Onyxia's Lair</div>
                <div class="campaign-raid-meta">40-Player · 1 Boss · Attuned</div>
              </div>
              <span class="campaign-raid-badge">3 / 40 at Lv 60</span>
            </div>
          </div>
          <button type="button" class="campaign-cta" onclick="setView('raids')">Open 9 Dec Raid Dossier →</button>
        </aside>
      ` : `
        <aside class="campaign-card">
          <div>
            <div class="campaign-kicker">Midnight Season 1 · Mobilization</div>
            <h2 class="campaign-title">Pre-Raid Gear Push</h2>
            <p class="campaign-desc">No seasonal raid boss kills logged yet. ${ds.guild} has ${members.filter(m=>m.level>=90).length} characters at Lv 90 cap and ${members.filter(m=>m.level>=80&&m.level<90).length} in the 80–89 leveling bracket.</p>
          </div>
          <div class="campaign-raid-list">
            <div class="campaign-raid-item">
              <div>
                <div class="campaign-raid-name">Midnight</div>
                <div class="campaign-raid-meta">4 Bosses · Normal / Heroic / Mythic</div>
              </div>
              <span class="campaign-raid-badge">0 / 4 Kills</span>
            </div>
            <div class="campaign-raid-item">
              <div>
                <div class="campaign-raid-name">The Voidspire</div>
                <div class="campaign-raid-meta">6 Bosses · Imperator to Crown</div>
              </div>
              <span class="campaign-raid-badge">0 / 6 Kills</span>
            </div>
            <div class="campaign-raid-item">
              <div>
                <div class="campaign-raid-name">Cap Readiness</div>
                <div class="campaign-raid-meta">Target Level 90 &amp; 210 Item Level</div>
              </div>
              <span class="campaign-raid-badge">Target 210</span>
            </div>
          </div>
          <button type="button" class="campaign-cta" onclick="setView('raids')">Inspect Raid Roster &amp; Bosses →</button>
        </aside>
      `;

      const capAndActiveCount = members.filter(m => state.game === 'forever' ? m.level >= 45 : (m.level >= 80 && m.className)).length;
      const altsCount = members.filter(m => m.className && (state.game === 'forever' ? m.level < 45 : m.level < 80)).length;
      const unindexedCount = members.filter(m => !m.className).length;

      let filtered = members.filter(m => {
        if (state.rosterBracket === 'active') {
          if (state.game === 'forever') return m.level >= 45;
          return m.className && m.level >= 80;
        }
        if (state.rosterBracket === 'alts') {
          return m.className && (state.game === 'forever' ? m.level < 45 : m.level < 80);
        }
        if (state.rosterBracket === 'unindexed') {
          return !m.className;
        }
        return true;
      });

      if (state.ownerFilter !== 'all') {
        filtered = filtered.filter(m => (m.owner || 'none') === state.ownerFilter);
      }
      if (state.classFilter !== 'all') {
        filtered = filtered.filter(m => m.className === state.classFilter);
      }
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        filtered = filtered.filter(m =>
          m.name.toLowerCase().includes(q) ||
          (m.className && m.className.toLowerCase().includes(q)) ||
          (m.spec && m.spec.toLowerCase().includes(q)) ||
          (m.race && m.race.toLowerCase().includes(q)) ||
          (m.owner && m.owner.toLowerCase().includes(q))
        );
      }

      filtered.sort((a, b) => {
        if (state.sortBy === 'readiness') return (computeReadiness(b) ?? -1) - (computeReadiness(a) ?? -1);
        if (state.sortBy === 'lastLogin') return (b.lastLogin || 0) - (a.lastLogin || 0);
        if (state.sortBy === 'name') return a.name.localeCompare(b.name);
        return progressionSortScore(b) - progressionSortScore(a);
      });

      const availableClasses = [...new Set(members.map(m => m.className).filter(Boolean))].sort();

      const rowsHtml = filtered.map(m => {
        const isUnknown = !m.className;
        const cText = classColor(m.className);
        const cBar = classBarColor(m.className);
        const score = computeReadiness(m);
        const tier = readinessTier(score);
        const legacy = isLegacyScale(m);
        const pct = m.ilvl ? Math.min(100, Math.round(((legacy ? 70 : m.ilvl) / targetIlvl) * 100)) : 0;
        const eq = m.equipmentSummary;

        let auditHtml = '<span class="pip-tag pip-muted">—</span>';
        if (eq) {
          const enchOk = eq.count - (eq.unenchanted || 0);
          const sockWarn = state.game === 'retail' && eq.emptySockets > 0
            ? '<span class="pip-tag pip-warn">' + eq.emptySockets + ' Empty Sock</span>'
            : '';
          const enchBadge = enchOk > 0
            ? '<span class="pip-tag pip-ok">' + enchOk + ' Ench</span>'
            : '<span class="pip-tag pip-muted">0 Ench</span>';
          auditHtml = '<div class="audit-pips">' + enchBadge + sockWarn + '</div>';
        }

        return `
          <tr class="roster-row" onclick="setView('detail', ${m.id})" tabindex="0" onkeydown="if(event.key==='Enter')setView('detail',${m.id})">
            <td>
              <div class="char-cell">
                ${m.avatarUrl
                  ? '<img class="char-avatar" src="' + m.avatarUrl + '" alt="" loading="lazy" />'
                  : '<div class="char-avatar-fallback">' + m.name.slice(0, 2).toUpperCase() + '</div>'}
                <div>
                  <div class="char-name-line">
                    <span style="color:${isUnknown ? 'var(--text-primary)' : cText}">${m.name}</span>
                    ${m.owner ? '<span class="owner-pill">' + m.owner + '</span>' : ''}
                  </div>
                  <div class="char-sub-line">
                    ${isUnknown
                      ? '<span>Unindexed Member · ' + (RANK_NAMES[m.rank] || 'Member') + '</span>'
                      : '<span>' + (m.race || '') + ' ' + (m.spec ? m.spec + ' ' : '') + m.className + '</span>'}
                  </div>
                </div>
              </div>
            </td>
            <td>
              <span style="font-family:var(--font-mono);font-weight:700;color:${m.level >= cap ? 'var(--accent-primary)' : 'var(--text-primary)'}">
                ${m.level ?? '—'}
              </span>
            </td>
            <td>
              ${m.ilvl != null ? `
                <div class="ilvl-meter-cell">
                  <span class="ilvl-val-mono">${m.ilvl}</span>
                  ${legacy
                    ? '<span class="legacy-tag" title="Dormant Level ' + m.level + ' character on a previous expansion item-level scale">Legacy Lv' + m.level + '</span>'
                    : '<div class="mini-bar-track"><div class="mini-bar-fill" style="width:' + pct + '%;background:' + cBar + '"></div></div>'}
                </div>
              ` : '<span style="color:var(--text-muted);font-family:var(--font-mono)">—</span>'}
            </td>
            <td>
              <span class="ready-chip ${tier.key}">${tier.label}</span>
            </td>
            <td class="hide-mobile">${auditHtml}</td>
            <td class="hide-mobile" style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary)">
              ${state.game === 'forever'
                ? (m.professions && m.professions.length ? m.professions[0] : '—')
                : (m.mounts != null ? m.mounts + ' Mts · ' + (m.pets ?? '—') + ' Pets' : (m.achievementPoints ? m.achievementPoints.toLocaleString() + ' AP' : '—'))}
            </td>
            <td style="font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)">
              ${formatRelativeTime(m.lastLogin)}
            </td>
          </tr>
        `;
      }).join('');

      return `
        ${renderMasthead(ds)}

        <div class="section-hdr">
          <div>
            <h2 class="section-title">
              <span>${state.game === 'forever' ? 'Expedition Vanguard (Level 60 Frontline)' : 'Guild Vanguard (Level 90 Frontline & Active Lead)'}</span>
            </h2>
            <p class="section-subtitle">${state.game === 'forever' ? 'Top classic adventurers leading the push toward 9 December raid opening. Click any card for their 17-slot paperdoll.' : 'Ranked by current-season progression tier so legacy Lv 70 item levels never outrank active Level 90 characters.'}</p>
          </div>
        </div>

        <div class="vanguard-layout">
          <div class="vanguard-grid">${vanguardCardsHtml}</div>
          ${campaignHtml}
        </div>

        <div class="section-hdr">
          <h2 class="section-title">Complete Guild Roster &amp; Warband (${filtered.length} shown)</h2>
          <span class="section-subtitle">Unknown API fields render as "—", never as 0. Click any character to open their Armory sheet.</span>
        </div>

        <div class="roster-toolbar">
          <div class="seg-group" role="tablist" aria-label="Roster Bracket Filter">
            <button type="button" class="seg-btn ${state.rosterBracket === 'all' ? 'active' : ''}" onclick="state.rosterBracket='all';render()">
              <span>All</span><span class="seg-count">${members.length}</span>
            </button>
            <button type="button" class="seg-btn ${state.rosterBracket === 'active' ? 'active' : ''}" onclick="state.rosterBracket='active';render()">
              <span>${state.game === 'forever' ? 'Lv 45–60 Core' : 'Lv 80–90 Active'}</span><span class="seg-count">${capAndActiveCount}</span>
            </button>
            <button type="button" class="seg-btn ${state.rosterBracket === 'alts' ? 'active' : ''}" onclick="state.rosterBracket='alts';render()">
              <span>Leveling &amp; Alts</span><span class="seg-count">${altsCount}</span>
            </button>
            ${unindexedCount > 0 ? `
              <button type="button" class="seg-btn ${state.rosterBracket === 'unindexed' ? 'active' : ''}" onclick="state.rosterBracket='unindexed';render()">
                <span>Unindexed</span><span class="seg-count">${unindexedCount}</span>
              </button>
            ` : ''}
          </div>

          <div class="filter-inputs">
            <select class="select-input" aria-label="Filter by Friend Warband" onchange="state.ownerFilter=this.value;render()">
              <option value="all" ${state.ownerFilter === 'all' ? 'selected' : ''}>All Friends / Owners</option>
              <option value="user1" ${state.ownerFilter === 'user1' ? 'selected' : ''}>user1 Warband</option>
              <option value="user2" ${state.ownerFilter === 'user2' ? 'selected' : ''}>user2 Warband</option>
              <option value="user3" ${state.ownerFilter === 'user3' ? 'selected' : ''}>user3 Warband</option>
              <option value="none" ${state.ownerFilter === 'none' ? 'selected' : ''}>Unclaimed Guildmates</option>
            </select>

            <select class="select-input" aria-label="Filter by Class" onchange="state.classFilter=this.value;render()">
              <option value="all">All Classes</option>
              ${availableClasses.map(c => '<option value="' + c + '" ' + (state.classFilter === c ? 'selected' : '') + '>' + c + '</option>').join('')}
            </select>

            <select class="select-input hide-mobile" aria-label="Sort Roster" onchange="state.sortBy=this.value;render()">
              <option value="progression" ${state.sortBy === 'progression' ? 'selected' : ''}>Sort: Progression Tier</option>
              <option value="readiness" ${state.sortBy === 'readiness' ? 'selected' : ''}>Sort: Readiness Score</option>
              <option value="lastLogin" ${state.sortBy === 'lastLogin' ? 'selected' : ''}>Sort: Last Seen</option>
              <option value="name" ${state.sortBy === 'name' ? 'selected' : ''}>Sort: Character Name</option>
            </select>

            <input type="search" class="search-input" placeholder="Search name, spec, owner..." value="${state.search.replace(/"/g, '&quot;')}" oninput="state.search=this.value;render()" aria-label="Search roster" />
          </div>
        </div>

        <div class="roster-table-wrap">
          <table class="roster-table">
            <thead>
              <tr>
                <th>Character</th>
                <th>Lvl</th>
                <th>Item Level</th>
                <th>Readiness</th>
                <th class="hide-mobile">Gear Audit</th>
                <th class="hide-mobile">${state.game === 'forever' ? 'Primary Trade' : 'Collections / AP'}</th>
                <th>Last Seen</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDetailView(ds) {
      const indexedMembers = ds.members.filter(m => m.className).sort((a, b) => progressionSortScore(b) - progressionSortScore(a));
      const activeChar = indexedMembers.find(m => m.id === state.selectedCharId) || indexedMembers[0];
      state.selectedCharId = activeChar.id;

      const compareChar = state.compareCharId ? indexedMembers.find(m => m.id === Number(state.compareCharId)) : null;

      const cHex = classHex(activeChar.className);
      const cText = classColor(activeChar.className);
      const score = computeReadiness(activeChar);
      const tier = readinessTier(score);
      const equip = buildFallbackEquipment(activeChar);

      const leftSlotNames = ['Head', 'Neck', 'Shoulders', 'Back', 'Chest', 'Shirt', 'Tabard', 'Wrist'];
      const rightSlotNames = ['Hands', 'Waist', 'Legs', 'Feet', 'Ring 1', 'Ring 2', 'Trinket 1', 'Trinket 2'];
      const weaponSlotNames = state.game === 'forever' ? ['Main Hand', 'Off Hand', 'Ranged'] : ['Main Hand', 'Off Hand'];

      function renderSlotCard(slotName) {
        const item = equip.find(e => e.slot === slotName);
        if (!item) {
          return `
            <div class="gear-slot-card">
              <div class="slot-icon-box">${slotName.slice(0, 2).toUpperCase()}</div>
              <div class="slot-info">
                <div class="slot-top-row">
                  <span class="slot-item-name" style="color:var(--text-muted)">Empty ${slotName}</span>
                  <span class="slot-ilvl">—</span>
                </div>
                <div class="slot-bottom-row"><span>${slotName}</span></div>
              </div>
            </div>
          `;
        }
        const statsStr = (item.stats || []).map(s => '+' + s.v + ' ' + s.n).join(' · ') || 'Cosmetic / Utility';
        const isCosmetic = slotName === 'Shirt' || slotName === 'Tabard';
        const auditBadges = [];
        if (!isCosmetic && item.enchantCount > 0) {
          auditBadges.push('<span class="slot-badge pip-ok">✓ Ench</span>');
        } else if (!isCosmetic && ['Head', 'Chest', 'Legs', 'Feet', 'Wrist', 'Back', 'Main Hand', 'Ring 1', 'Ring 2'].includes(slotName)) {
          auditBadges.push('<span class="slot-badge pip-muted">No Ench</span>');
        }
        if (state.game === 'retail' && item.hasEmptySocket) {
          auditBadges.push('<span class="slot-badge pip-warn">◇ Socket</span>');
        }
        return `
          <div class="gear-slot-card q-${item.quality || 'Uncommon'}">
            <div class="slot-icon-box">${slotName.slice(0, 3).toUpperCase()}</div>
            <div class="slot-info">
              <div class="slot-top-row">
                <span class="slot-item-name" title="${item.name}">${item.name}</span>
                <span class="slot-ilvl">${item.ilvl ?? '—'}</span>
              </div>
              <div class="slot-bottom-row">
                <span class="slot-stats-str">${slotName} · ${statsStr}</span>
                <span class="slot-audit-badges">${auditBadges.join('')}</span>
              </div>
            </div>
          </div>
        `;
      }

      const switcherHtml = indexedMembers.slice(0, 12).map(m => `
        <button type="button" class="armory-char-pill ${m.id === activeChar.id ? 'active' : ''}" onclick="setView('detail', ${m.id})">
          ${m.avatarUrl ? '<img src="' + m.avatarUrl + '" alt="" />' : ''}
          <span style="color:${classColor(m.className)}">${m.name}</span>
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">Lv${m.level} · ${m.ilvl ?? '—'}</span>
        </button>
      `).join('');

      const st = activeChar.stats || {};
      const ls = activeChar.lifeStats || {};
      const eqSum = activeChar.equipmentSummary || { count: equip.length, emptySockets: 0, unenchanted: 0 };

      let compareBannerHtml = '';
      if (compareChar) {
        const compScore = computeReadiness(compareChar);
        const ilvlDiff = (activeChar.ilvl || 0) - (compareChar.ilvl || 0);
        const scoreDiff = (score || 0) - (compScore || 0);
        const hpA = st.health || 0;
        const hpB = compareChar.stats?.health || 0;
        const hpDiff = hpA - hpB;
        const fmtDelta = (n) => n > 0 ? '<span style="color:var(--status-ready)">+' + n.toLocaleString() + '</span>' : (n < 0 ? '<span style="color:var(--status-risk)">' + n.toLocaleString() + '</span>' : '0');
        compareBannerHtml = `
          <div class="compare-banner">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div style="font-size:13.5px;font-weight:700;">
                Comparing <span style="color:${cText}">${activeChar.name}</span> vs. <span style="color:${classColor(compareChar.className)}">${compareChar.name}</span> (Lv ${compareChar.level} ${compareChar.spec || ''} ${compareChar.className})
              </div>
              <button type="button" class="owner-pill" onclick="state.compareCharId=null;render()">Close Comparison ✕</button>
            </div>
            <div class="compare-grid">
              <div class="stat-kv-box">
                <div class="stat-kv-val">${activeChar.ilvl ?? '—'} vs ${compareChar.ilvl ?? '—'} (${fmtDelta(ilvlDiff)})</div>
                <div class="stat-kv-lbl">Item Level Delta</div>
              </div>
              <div class="stat-kv-box">
                <div class="stat-kv-val">${score ?? '—'} vs ${compScore ?? '—'} (${fmtDelta(scoreDiff)})</div>
                <div class="stat-kv-lbl">Readiness Score Delta</div>
              </div>
              <div class="stat-kv-box">
                <div class="stat-kv-val">${hpA ? hpA.toLocaleString() : '—'} vs ${hpB ? hpB.toLocaleString() : '—'} (${fmtDelta(hpDiff)})</div>
                <div class="stat-kv-lbl">Max Health Delta</div>
              </div>
              <div class="stat-kv-box">
                <div class="stat-kv-val">${activeChar.achievementPoints ?? '—'} vs ${compareChar.achievementPoints ?? '—'}</div>
                <div class="stat-kv-lbl">Achievement Points</div>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="section-hdr" style="margin-bottom:8px;">
          <div>
            <button type="button" onclick="setView('roster')" style="font-size:12.5px;font-weight:700;color:var(--accent-primary);margin-bottom:4px;display:inline-flex;align-items:center;gap:5px;">
              ← Back to ${ds.guild} Roster
            </button>
            <h1 class="section-title" style="font-size:24px;">Armory Inspection &amp; Equipment Sheet</h1>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <label for="compareSelect" style="font-size:12px;color:var(--text-secondary);font-weight:600;">Compare with:</label>
            <select id="compareSelect" class="select-input" onchange="state.compareCharId=this.value?Number(this.value):null;render()">
              <option value="">None (Solo Inspection)</option>
              ${indexedMembers.filter(m => m.id !== activeChar.id).map(m => '<option value="' + m.id + '" ' + (state.compareCharId === m.id ? 'selected' : '') + '>' + m.name + ' (Lv' + m.level + ' ' + m.className + ' · ' + (m.ilvl ?? '—') + ' iLvl)</option>').join('')}
            </select>
          </div>
        </div>

        <div class="armory-switcher-bar" role="navigation" aria-label="Character Switcher">
          ${switcherHtml}
        </div>

        ${compareBannerHtml}

        <div class="paperdoll-stage">
          <div class="slot-column">
            ${leftSlotNames.map(renderSlotCard).join('')}
          </div>

          <div class="paperdoll-center">
            <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
              <span class="lvl-pill">Level ${activeChar.level}</span>
              <span class="ready-chip ${tier.key}">${tier.label}</span>
            </div>

            <div class="paperdoll-render-stage">
              <div class="vanguard-aura" style="background:${cHex};top:25px;"></div>
              <div class="paperdoll-pedestal"></div>
              ${activeChar.mainRawUrl ? '<img class="paperdoll-render-img" src="' + activeChar.mainRawUrl + '" alt="' + activeChar.name + '" />' : ''}
            </div>

            <h2 style="font-family:var(--font-display);font-size:25px;color:${cText};line-height:1.1;">${activeChar.name}</h2>
            ${activeChar.title ? '<div style="font-size:12.5px;color:var(--accent-primary);font-weight:600;margin-top:2px;">&lt;' + activeChar.title + '&gt;</div>' : ''}
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">
              ${activeChar.race || '—'} ${activeChar.spec ? activeChar.spec + ' ' : ''}${activeChar.className} · ${ds.guild}
            </div>
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center;">
              <span class="audit-micro">Avg iLvl: <strong>${activeChar.ilvl ?? '—'}</strong></span>
              <span class="audit-micro">Role: <strong>${memberRole(activeChar)}</strong></span>
              <span class="audit-micro">Owner: <strong>${activeChar.owner ?? '—'}</strong></span>
              <span class="audit-micro">Seen: <strong>${formatRelativeTime(activeChar.lastLogin)}</strong></span>
            </div>

            <div class="weapons-row">
              ${weaponSlotNames.map(renderSlotCard).join('')}
            </div>
          </div>

          <div class="slot-column">
            ${rightSlotNames.map(renderSlotCard).join('')}
          </div>
        </div>

        <div class="armory-bottom-grid">
          <div class="detail-panel">
            <div class="panel-title">
              <span>Combat Attributes</span>
              <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">Snapshot</span>
            </div>
            <div class="stat-bars-list">
              <div class="stat-bar-row">
                <div class="stat-bar-hdr"><span>Critical Strike</span><span style="font-family:var(--font-mono)">${st.crit != null ? st.crit + '%' : '—'}</span></div>
                <div class="vanguard-bar-track"><div class="vanguard-bar-fill" style="width:${Math.min(100, (st.crit || 0) * 2.5)}%;background:#F59E0B"></div></div>
              </div>
              <div class="stat-bar-row">
                <div class="stat-bar-hdr"><span>${state.game === 'forever' ? 'Hit Chance' : 'Haste'}</span><span style="font-family:var(--font-mono)">${state.game === 'forever' ? (st.hit != null ? st.hit + '%' : '—') : (st.haste != null ? st.haste + '%' : '—')}</span></div>
                <div class="vanguard-bar-track"><div class="vanguard-bar-fill" style="width:${Math.min(100, ((state.game === 'forever' ? st.hit * 8 : st.haste * 2.5) || 0))}%;background:#10B981"></div></div>
              </div>
              ${state.game === 'retail' ? `
                <div class="stat-bar-row">
                  <div class="stat-bar-hdr"><span>Mastery</span><span style="font-family:var(--font-mono)">${st.mastery != null ? st.mastery + '%' : '—'}</span></div>
                  <div class="vanguard-bar-track"><div class="vanguard-bar-fill" style="width:${Math.min(100, (st.mastery || 0) * 2)}%;background:#8B5CF6"></div></div>
                </div>
                <div class="stat-bar-row">
                  <div class="stat-bar-hdr"><span>Versatility</span><span style="font-family:var(--font-mono)">${st.vers != null ? st.vers + '%' : '—'}</span></div>
                  <div class="vanguard-bar-track"><div class="vanguard-bar-fill" style="width:${Math.min(100, (st.vers || 0) * 4)}%;background:#38BDF8"></div></div>
                </div>
              ` : ''}
            </div>
            <div class="stat-kv-grid">
              <div class="stat-kv-box"><div class="stat-kv-val">${st.health ? st.health.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Max Health</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${st.armor ? st.armor.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Armor</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${(st.strength || st.agility || st.intellect) ? (st.strength || st.agility || st.intellect).toLocaleString() : '—'}</div><div class="stat-kv-lbl">Primary Stat</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${st.stamina ? st.stamina.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Stamina</div></div>
            </div>
          </div>

          <div class="detail-panel">
            <div class="panel-title">
              <span>Raid Readiness Audit</span>
              <span class="ready-chip ${tier.key}">${tier.label}</span>
            </div>
            <div class="stat-kv-grid" style="margin-top:0;margin-bottom:12px;">
              <div class="stat-kv-box"><div class="stat-kv-val">${activeChar.level} / ${state.game === 'forever' ? 60 : 90}</div><div class="stat-kv-lbl">Character Level</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${activeChar.ilvl ?? '—'} / ${state.game === 'forever' ? 58 : 210}</div><div class="stat-kv-lbl">Item Level Target</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${(eqSum.count || 16) - (eqSum.unenchanted || 0)} / ${eqSum.count || 16}</div><div class="stat-kv-lbl">Enchanted Slots</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${state.game === 'forever' ? 'N/A (Classic)' : (eqSum.emptySockets ?? 0) + ' Empty'}</div><div class="stat-kv-lbl">Gem Sockets</div></div>
            </div>
            <div style="font-size:12.5px;color:var(--text-secondary);display:flex;flex-direction:column;gap:6px;">
              <div>• <strong>Progression Check:</strong> ${activeChar.level >= (state.game === 'forever' ? 60 : 90) ? 'At level cap and eligible for raid entry.' : 'Needs ' + ((state.game === 'forever' ? 60 : 90) - activeChar.level) + ' more levels to reach raid cap.'}</div>
              <div>• <strong>Enchant Audit:</strong> ${eqSum.unenchanted > 0 ? eqSum.unenchanted + ' equipped slots are currently unenchanted.' : 'All primary slots enchanted.'}</div>
              ${state.game === 'retail' ? '<div>• <strong>Socket Audit:</strong> ' + (eqSum.emptySockets > 0 ? eqSum.emptySockets + ' empty socket(s) on Neck/Rings need gems.' : 'Zero empty sockets detected.') + '</div>' : '<div>• <strong>Attunements:</strong> ' + ((activeChar.attunements && activeChar.attunements.length) ? activeChar.attunements.join(', ') : 'In progress toward Onyxia & Barrow Deeps.') + '</div>'}
            </div>
          </div>

          <div class="detail-panel">
            <div class="panel-title">
              <span>Lifetime Chronicle</span>
              <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">${activeChar.achievementPoints ? activeChar.achievementPoints.toLocaleString() + ' AP' : 'Classic Log'}</span>
            </div>
            <div class="stat-kv-grid" style="margin-top:0;">
              <div class="stat-kv-box"><div class="stat-kv-val">${ls.killingBlows != null ? ls.killingBlows.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Killing Blows</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${ls.creaturesKilled != null ? ls.creaturesKilled.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Creatures Slain</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${ls.bossesDefeated != null ? ls.bossesDefeated.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Bosses Defeated</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${ls.dungeonsEntered != null ? ls.dungeonsEntered.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Dungeons Entered</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${ls.questsCompleted != null ? ls.questsCompleted.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Quests Completed</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${ls.deathsFromFalling != null ? ls.deathsFromFalling.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Elevator / Fall Deaths</div></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderRoleMatrix(ds) {
      const minLvl = state.game === 'forever' ? 40 : 80;
      const pool = ds.members
        .filter(m => m.className && m.level >= minLvl)
        .sort((a, b) => progressionSortScore(b) - progressionSortScore(a));
      const tanks = pool.filter(m => memberRole(m) === 'Tank');
      const healers = pool.filter(m => memberRole(m) === 'Healer');
      const dps = pool.filter(m => memberRole(m) === 'DPS');

      const renderRoleCol = (title, targetStr, list) => `
        <div class="detail-panel">
          <div class="panel-title">
            <span>${title}</span>
            <span class="owner-pill">${list.length} Candidates · Target ${targetStr}</span>
          </div>
          <div class="boss-chip-list">
            ${list.slice(0, 5).map(m => {
              const tier = readinessTier(computeReadiness(m));
              return `
                <div class="boss-row" onclick="setView('detail', ${m.id})" style="cursor:pointer;">
                  <div>
                    <span style="color:${classColor(m.className)};font-weight:700;">${m.name}</span>
                    <span style="font-size:11px;color:var(--text-muted);margin-left:5px;">Lv${m.level} ${m.spec || m.className}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:700;">${m.ilvl ?? '—'}</span>
                    <span class="ready-chip ${tier.key}" style="font-size:10px;padding:1px 5px;">${tier.label.split(' ')[0]}</span>
                  </div>
                </div>
              `;
            }).join('') || '<div style="font-size:12px;color:var(--text-muted)">No candidates at Lv ' + minLvl + '+ yet</div>'}
          </div>
        </div>
      `;

      return `
        <div class="section-hdr">
          <div>
            <h2 class="section-title">Strike Team Role Matrix (${state.game === 'forever' ? 'Lv 40–60 Expedition Pool' : 'Lv 80–90 Active Roster'})</h2>
            <p class="section-subtitle">Click any candidate to inspect their gear, enchants, and readiness checklist.</p>
          </div>
        </div>
        <div class="role-matrix-grid">
          ${renderRoleCol('Vanguard Tanks', '2', tanks)}
          ${renderRoleCol('Raid Healers', '2–4', healers)}
          ${renderRoleCol('Damage Dealers (DPS)', '6–14', dps)}
        </div>
      `;
    }

    function renderRaidsView(ds) {
      if (state.game === 'forever') {
        const lv60 = ds.members.filter(m => m.level >= 60);
        const lv50s = ds.members.filter(m => m.level >= 50 && m.level < 60);
        return `
          ${renderMasthead(ds)}
          <div class="raids-hero-banner">
            <div>
              <div class="masthead-kicker">PHASE 1 RAID GATES · OPENING WEDNESDAY, 9 DECEMBER 2026</div>
              <h2 style="font-family:var(--font-display);font-size:28px;margin:4px 0 8px;">26 Days Until Barrow Deeps, Hyjal Summit &amp; Onyxia's Lair</h2>
              <p style="font-size:14px;color:var(--text-secondary);">World of Warcraft: Forever launched 4 November 2026. Raid instances are locked server-wide until 9 December. Below is our guild's live attunement and Level 60 roster mobilization for opening week.</p>
            </div>
            <div class="stat-kv-grid" style="margin:0;">
              <div class="stat-kv-box"><div class="stat-kv-val">9 Dec</div><div class="stat-kv-lbl">Gates Unlock</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${lv60.length} / 10</div><div class="stat-kv-lbl">Barrow Deeps 60s</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">${lv50s.length}</div><div class="stat-kv-lbl">Lv 50–59 Final Push</div></div>
              <div class="stat-kv-box"><div class="stat-kv-val">1 Diff</div><div class="stat-kv-lbl">Classic Ruleset</div></div>
            </div>
          </div>

          ${renderRoleMatrix(ds)}

          <div class="section-hdr">
            <h2 class="section-title">Phase 1 Classic+ Raid Dossiers (Unlocking 9 December)</h2>
            <span class="section-subtitle">Single classic difficulty · Fixed 10 / 20 / 40 player raid sizes</span>
          </div>

          <div class="raid-tiers-grid">
            ${ds.raids.map(r => `
              <div class="raid-tier-card featured">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                  <div>
                    <div style="font-family:var(--font-mono);font-size:11px;color:var(--accent-secondary);font-weight:700;">${r.size}-PLAYER RAID · ${r.bossCount} BOSS${r.bossCount > 1 ? 'ES' : ''}</div>
                    <h3 style="font-family:var(--font-display);font-size:20px;margin-top:2px;">${r.name}</h3>
                    <div style="font-size:12px;color:var(--text-muted);">${r.location} · Target iLvl ${r.targetIlvl}+</div>
                  </div>
                  <span class="ready-chip watch">Opens ${r.opensAt}</span>
                </div>
                <p style="font-size:12.5px;color:var(--text-secondary);">${r.lore}</p>
                <div style="padding:8px 10px;background:var(--bg-elevated);border-radius:var(--radius-sm);border:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:12px;">
                  Level 60 Ready: <strong>${lv60.length} of ${r.size}</strong> (${lv60.map(m=>m.name.split(' ')[0]).join(', ')})
                </div>
                <div class="boss-chip-list">
                  ${r.bosses.slice(0, 6).map((b, i) => `
                    <div class="boss-row">
                      <span><strong>${i + 1}.</strong> ${b}</span>
                      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">Locked · 9 Dec</span>
                    </div>
                  `).join('')}
                  ${r.bosses.length > 6 ? '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;padding-top:4px;">+ ' + (r.bosses.length - 6) + ' additional encounters in ' + r.name + '</div>' : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      const tiers = DATA.retail.raidCatalog || [];
      const capChars = ds.members.filter(m => m.level >= 90).sort((a, b) => (b.ilvl || 0) - (a.ilvl || 0));
      const nearCapChars = ds.members.filter(m => m.level >= 80 && m.level < 90).sort((a, b) => b.level - a.level || (b.ilvl || 0) - (a.ilvl || 0));

      return `
        ${renderMasthead(ds)}
        <div class="raids-hero-banner">
          <div>
            <div class="masthead-kicker">MIDNIGHT SEASON 1 CAMPAIGN · PRE-RAID MOBILIZATION</div>
            <h2 style="font-family:var(--font-display);font-size:26px;margin:4px 0 8px;">0 Boss Kills Logged This Season — Building the Level 90 Strike Team</h2>
            <p style="font-size:13.5px;color:var(--text-secondary);">Rather than displaying an empty table of dashes, this board tracks ${ds.guild}'s active mobilization toward our first Normal/Heroic pull in <strong>Midnight</strong> and <strong>The Voidspire</strong> (Target: Level 90 &amp; Item Level 210).</p>
          </div>
          <div class="stat-kv-grid" style="margin:0;">
            <div class="stat-kv-box"><div class="stat-kv-val">${capChars.length}</div><div class="stat-kv-lbl">At Level 90 Cap</div></div>
            <div class="stat-kv-box"><div class="stat-kv-val">${nearCapChars.length}</div><div class="stat-kv-lbl">Lv 80–89 Bench</div></div>
            <div class="stat-kv-box"><div class="stat-kv-val">209</div><div class="stat-kv-lbl">Top Cap iLvl</div></div>
            <div class="stat-kv-box"><div class="stat-kv-val">0 / 23</div><div class="stat-kv-lbl">Season Boss Kills</div></div>
          </div>
        </div>

        ${renderRoleMatrix(ds)}

        <div class="section-hdr">
          <h2 class="section-title">Current Season Raid Tiers (Normal / Heroic / Mythic)</h2>
          <span class="section-subtitle">Discovered automatically from Blizzard Raid Journal snapshot</span>
        </div>

        <div class="raid-tiers-grid">
          ${tiers.slice(0, 4).map((t, idx) => `
            <div class="raid-tier-card ${idx < 2 ? 'featured' : ''}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                  <div style="font-family:var(--font-mono);font-size:11px;color:var(--accent-primary);font-weight:700;">TIER ${idx + 1} · ${t.bosses.length} ENCOUNTERS</div>
                  <h3 style="font-family:var(--font-display);font-size:20px;margin-top:2px;">${t.name}</h3>
                </div>
                <span class="ready-chip risk">0 / ${t.bosses.length} Defeated</span>
              </div>
              <div class="boss-chip-list">
                ${t.bosses.map((b, bi) => `
                  <div class="boss-row">
                    <span><strong>${bi + 1}.</strong> ${b.name}</span>
                    <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">N — · H — · M —</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderReadinessView(ds) {
      const cap = state.game === 'forever' ? 60 : 90;
      const targetIlvl = state.game === 'forever' ? 58 : 210;
      const ranked = ds.members
        .filter(m => m.className && m.level >= (state.game === 'forever' ? 30 : 75))
        .sort((a, b) => (computeReadiness(b) ?? 0) - (computeReadiness(a) ?? 0));

      return `
        ${renderMasthead(ds)}
        <div class="section-hdr">
          <div>
            <h2 class="section-title">Raid Readiness &amp; Pre-Pull Checklist</h2>
            <p class="section-subtitle">Scored out of 100: Level (${cap} cap = 35 pts) + Item Level (${targetIlvl} target = 45 pts) + Enchants &amp; Sockets (20 pts). Characters below level cap are capped at 74.</p>
          </div>
        </div>
        <div class="raid-tiers-grid">
          ${ranked.map(m => {
            const score = computeReadiness(m);
            const tier = readinessTier(score);
            const eq = m.equipmentSummary || { count: 16, emptySockets: 0, unenchanted: 16 };
            const tasks = [];
            if (m.level < cap) tasks.push('Reach Level ' + cap + ' (currently Lv ' + m.level + ')');
            if ((m.ilvl || 0) < targetIlvl || isLegacyScale(m)) tasks.push('Raise current-season item level to ' + targetIlvl + ' (currently ' + (m.ilvl ?? '—') + ')');
            if (eq.unenchanted > 0) tasks.push('Apply enchants (' + eq.unenchanted + ' slots unenchanted)');
            if (state.game === 'retail' && eq.emptySockets > 0) tasks.push('Socket ' + eq.emptySockets + ' empty gem slot(s)');
            return `
              <div class="raid-tier-card" onclick="setView('detail', ${m.id})" style="cursor:pointer;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <div class="char-cell">
                    ${m.avatarUrl ? '<img class="char-avatar" src="' + m.avatarUrl + '" alt="" />' : ''}
                    <div>
                      <div style="font-weight:700;font-size:15px;color:${classColor(m.className)}">${m.name}</div>
                      <div style="font-size:12px;color:var(--text-secondary)">Lv ${m.level} ${m.spec || ''} ${m.className} · iLvl ${m.ilvl ?? '—'}</div>
                    </div>
                  </div>
                  <span class="ready-chip ${tier.key}">${tier.label}</span>
                </div>
                <div style="font-size:12.5px;color:var(--text-secondary);display:flex;flex-direction:column;gap:4px;">
                  ${tasks.map(t => '<div>• ' + t + '</div>').join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCollectionsView(ds) {
      const owners = ['user1', 'user2', 'user3'];
      const ownerCards = owners.map(o => {
        const chars = ds.members.filter(m => m.owner === o);
        const maxAp = Math.max(0, ...chars.map(m => m.achievementPoints || 0));
        const maxMounts = Math.max(0, ...chars.map(m => m.mounts || 0));
        const maxPets = Math.max(0, ...chars.map(m => m.pets || 0));
        return { owner: o, chars, maxAp, maxMounts, maxPets };
      }).filter(o => o.chars.length > 0);

      return `
        ${renderMasthead(ds)}
        <div class="section-hdr">
          <div>
            <h2 class="section-title">Friend Warbands, Leaderboard &amp; Collections</h2>
            <p class="section-subtitle">Account-wide achievement points, mounts, unique battle pets, and alt rosters grouped by player.</p>
          </div>
        </div>
        <div class="raid-tiers-grid">
          ${ownerCards.map(o => `
            <div class="raid-tier-card featured">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <h3 style="font-family:var(--font-display);font-size:20px;">${o.owner} Warband</h3>
                <span class="owner-pill">${o.chars.length} Characters</span>
              </div>
              <div class="stat-kv-grid" style="margin:0;">
                <div class="stat-kv-box"><div class="stat-kv-val">${o.maxAp ? o.maxAp.toLocaleString() : '—'}</div><div class="stat-kv-lbl">Achievement Pts</div></div>
                <div class="stat-kv-box"><div class="stat-kv-val">${o.maxMounts || '—'}</div><div class="stat-kv-lbl">Total Mounts</div></div>
                <div class="stat-kv-box"><div class="stat-kv-val">${o.maxPets || '—'}</div><div class="stat-kv-lbl">Unique Pets</div></div>
                <div class="stat-kv-box"><div class="stat-kv-val">Lv ${Math.max(...o.chars.map(c=>c.level||0))}</div><div class="stat-kv-lbl">Highest Character</div></div>
              </div>
              <div class="boss-chip-list">
                ${o.chars.sort((a,b)=>progressionSortScore(b)-progressionSortScore(a)).slice(0, 6).map(c => `
                  <div class="boss-row" onclick="setView('detail', ${c.id})" style="cursor:pointer;">
                    <span style="color:${classColor(c.className)};font-weight:700;">${c.name}</span>
                    <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary)">Lv ${c.level ?? '—'} ${c.className || 'Unindexed'} · iLvl ${c.ilvl ?? '—'}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function render() {
      document.documentElement.dataset.game = state.game;
      document.documentElement.dataset.guild = state.guild;
      document.documentElement.dataset.view = state.view;

      document.querySelectorAll('.game-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.targetGame === state.game);
      });
      document.querySelectorAll('.guild-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.guild === state.guild);
      });
      document.getElementById('guildSwitcher').style.display = state.game === 'forever' ? 'none' : 'inline-flex';
      document.querySelectorAll('[data-view-btn]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.viewBtn === state.view);
      });

      const ds = getActiveDataset();
      const root = document.getElementById('appRoot');
      if (state.view === 'detail') {
        root.innerHTML = renderDetailView(ds);
      } else if (state.view === 'raids') {
        root.innerHTML = renderRaidsView(ds);
      } else if (state.view === 'readiness') {
        root.innerHTML = renderReadinessView(ds);
      } else if (state.view === 'collections') {
        root.innerHTML = renderCollectionsView(ds);
      } else {
        root.innerHTML = renderRosterView(ds);
      }
    }

    parseQuery();
    render();
  </script>
</body>
</html>
