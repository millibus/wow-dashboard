<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guild Dashboard — moved</title>
  <meta name="robots" content="noindex">
  <!-- The dashboard that lived here is now the site root. Old /v2/ links and
       bookmarks keep working: the script forwards the query string and hash
       (deep links such as ?guild=riot-act&tab=raids use the same parameters
       at the root); the meta refresh covers the no-script case. -->
  <meta http-equiv="refresh" content="0; url=../">
  <link rel="canonical" href="../">
  <script>location.replace('../' + location.search + location.hash);</script>
</head>
<body>
  <p>The dashboard has moved to <a href="../">the main page</a>.</p>
</body>
</html>
