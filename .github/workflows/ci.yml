name: CI

on:
  pull_request:
  # Also on main, so a squash merge and Dependabot's weekly bumps are
  # verified on the branch that actually ships. The hourly data commits and
  # the keepalive marker cannot trigger this anyway (pushes made with
  # GITHUB_TOKEN never start workflows, and they carry [skip ci]); the
  # paths-ignore makes that intent explicit and independent of either rule.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
      - '.github/keepalive'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The pipeline and its tests are dependency-free; nothing to install.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run tests (unit + end-to-end pipeline against fixtures)
        run: npm test

      - name: Validate committed snapshot data
        run: |
          node scripts/validate-snapshot.js docs/data
          node scripts/validate-snapshot-v2.js docs/data/v2 --allow-missing

  # Browser coverage for the V2 dashboard: real docs/v2 sources against a
  # snapshot the real pipeline builds from fixtures, plus axe accessibility
  # scans of every view. No credentials and no Blizzard traffic.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser + accessibility tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
