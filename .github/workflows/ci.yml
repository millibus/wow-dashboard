name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Run tests (unit + end-to-end pipeline against fixtures)
        run: npm test

      - name: Validate committed snapshot data
        run: |
          node scripts/validate-snapshot.js docs/data
          node scripts/validate-snapshot-v2.js docs/data/v2 --allow-missing

  # Browser coverage for the V2 dashboard: real docs/v2 sources against a
  # snapshot the real pipeline builds from fixtures, plus axe accessibility
  # scans of every view. No credentials and no Blizzard traffic.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser + accessibility tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
